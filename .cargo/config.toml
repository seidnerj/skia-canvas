# Build Skia from a local source tree (../skia-m156) instead of rust-skia's prebuilt binaries, so Skia patches
# apply. ../skia-m156 is the Skia commit rust-skia 0.156.0 pins (m156, Chrome 156's milestone) on branch
# mtl-f32-156, carrying: HarfBuzz ptem for AAT trak tracking (as Blink's harfbuzz_face.cc does), SK_MTL_F32
# (full-precision Graphite Metal shaders, as Chrome's Dawn device runs them), a float4 framebuffer-fetch input
# under SK_MTL_F32, and a Graphite default image provider that uploads raster images.
[env]
SKIA_SOURCE_DIR = { value = "../skia-m156", relative = true }
SKIA_GN_COMMAND = { value = "../skia-m156/bin/gn", relative = true }
SKIA_NINJA_COMMAND = "ninja"
